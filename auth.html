<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Invoicer Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
        }
        .auth-card {
            background: white;
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.5s ease-out;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo i {
            font-size: 3.5rem;
            color: var(--primary);
        }
        .auth-logo h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 1rem;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: #f1f5f9;
            padding: 0.25rem;
            border-radius: 0.75rem;
        }
        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        .auth-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        #auth-error {
            background: #fee2e2;
            color: #ef4444;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <i class="ph-fill ph-receipt"></i>
            <h1>Invoicer Pro</h1>
        </div>

        <div class="auth-tabs">
            <div id="tab-login" class="auth-tab active" onclick="switchTab('login')">Login</div>
            <div id="tab-signup" class="auth-tab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <div id="auth-error"></div>

        <form id="auth-form" class="form-section">
            <div class="input-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="auth-submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">
                Sign In
            </button>
        </form>

        <div style="display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.75rem; font-weight: 600;">
            <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
            OR
            <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        </div>

        <button id="google-signin" class="btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: white; border: 1px solid var(--border-color); color: var(--text-main); height: 44px;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18">
            Continue with Google
        </button>

        <div class="auth-footer">
            Easy invoicing, professional results.
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script>
        function switchTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('auth-submit');
            
            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                submitBtn.innerText = 'Sign In';
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                submitBtn.innerText = 'Create Account';
            }
            document.getElementById('auth-error').style.display = 'none';
        }
        window.switchTab = switchTab;
    </script>
</body>
</html>
